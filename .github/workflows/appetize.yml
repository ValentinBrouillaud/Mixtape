name: Build for Appetize (iOS Simulator)

# À placer dans : .github/workflows/appetize.yml  (dans votre fork de Mixtape)
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   APPETIZE_API_TOKEN   -> token API Appetize (Account > API token)
# Variable optionnelle (Settings > Variables) :
#   APPETIZE_PUBLIC_KEY  -> clé publique d'une app existante (pour la mettre à jour au lieu d'en créer une nouvelle)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26          # runner avec Xcode 26 / SDK iOS 26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Sélection de Xcode 26
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Cache Carthage (VLCKit, ~500 Mo)
        uses: actions/cache@v4
        with:
          path: Carthage
          key: carthage-${{ hashFiles('Cartfile.resolved') }}

      - name: Carthage bootstrap
        run: |
          brew install carthage
          carthage bootstrap --use-xcframeworks --platform iOS --cache-builds

      - name: Build simulateur iOS (sans signature)
        run: |
          xcodebuild \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipMacroValidation -skipPackagePluginValidation \
            build

      - name: Empaquetage du .app (zip pour Appetize)
        run: |
          APP="$(find build/Build/Products -maxdepth 2 -name 'Mixtape.app' -path '*iphonesimulator*' | head -n 1)"
          echo "App trouvée : $APP"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Mixtape-simulator.zip
          ls -lh Mixtape-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mixtape-simulator
          path: Mixtape-simulator.zip

      - name: Upload vers Appetize.io
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "Pas de token Appetize : upload ignoré (le zip reste dispo dans les artifacts)."
            exit 0
          fi
          URL="https://api.appetize.io/v1/apps"
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then URL="$URL/$APPETIZE_PUBLIC_KEY"; fi
          curl --fail-with-body -sS "$URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@Mixtape-simulator.zip" \
            -F "platform=ios" | tee appetize-response.json
          echo
          echo "Public key / URL :"
          python3 -c "import json;d=json.load(open('appetize-response.json'));print(d.get('publicKey'), d.get('publicURL'))"
