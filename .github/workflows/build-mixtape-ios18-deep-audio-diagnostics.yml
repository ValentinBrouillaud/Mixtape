      - name: Install VLCKit XCFrameworks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v carthage >/dev/null 2>&1; then brew install carthage; fi
          carthage bootstrap --use-xcframeworks --platform iOS --cache-builds 2>&1 | tee "$LOG_DIR/carthage.log"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            2>&1 | tee "$LOG_DIR/spm.log"
          RESOLVED='Mixtape.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          if [ -f "$RESOLVED" ]; then cp "$RESOLVED" "$LOG_DIR/Package.resolved"; fi

      - name: Check the effective iOS deployment target and project configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Mixtape.xcodeproj -scheme Mixtape \
            -configuration Debug -sdk iphoneos -showBuildSettings \
            > "$LOG_DIR/build-settings.txt" 2>&1
          python3 - <<'PY_SETTINGS'
          from pathlib import Path
          import re
          txt = Path('build-ios18-clean/logs/build-settings.txt').read_text()
          # Only check the Mixtape app, not dependency targets with different minima.
          sections = re.split(r'(?m)^Build settings for action \w+ and target ', txt)
          sections = [chunk for chunk in sections if chunk.startswith('Mixtape:')]
          if not sections:
              raise SystemExit('Unable to find Mixtape target build settings')
          values = re.findall(r'^\s*IPHONEOS_DEPLOYMENT_TARGET = (\S+)',
                              sections[0], flags=re.M)
          if values != ['18.0']:
              raise SystemExit(f'iOS 18 deployment target not effective for Mixtape: {values}')
          print('Verified IPHONEOS_DEPLOYMENT_TARGET = 18.0')
          PY_SETTINGS

      - name: Build unsigned iOS 18 iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            -jobs 2 \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$LOG_DIR/xcodebuild.log"

      - name: Package Mixtape IPA for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphoneos/Mixtape.app"
          test -d "$APP"
          file "$APP/Mixtape"
          lipo "$APP/Mixtape" -verify_arch arm64
          xcrun dwarfdump --uuid "$APP/Mixtape" > "$LOG_DIR/app-binary-uuid.txt" || true
          find "$APP" -name 'Mixtape.debug.dylib' -exec xcrun dwarfdump --uuid '{}' \; > "$LOG_DIR/debug-dylib-uuid.txt" || true
          # Give this experimental build a distinct version to avoid confusing IPA artifacts.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0.20' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 20' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | tee "$LOG_DIR/diagnostic-app-version.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | tee -a "$LOG_DIR/diagnostic-app-version.txt"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | tee "$LOG_DIR/minimum-ios.txt"
          grep -Fxq '18.0' "$LOG_DIR/minimum-ios.txt"
          mkdir -p "$GITHUB_WORKSPACE/ios18-payload/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/ios18-payload/Payload/Mixtape.app"
          cd "$GITHUB_WORKSPACE/ios18-payload"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Mixtape-iOS18-DeepDiagnostics-unsigned.ipa"
          unzip -tq "$GITHUB_WORKSPACE/Mixtape-iOS18-DeepDiagnostics-unsigned.ipa"

      - name: Verify embedded frameworks do not require iOS above 18
        shell: bash
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphoneos/Mixtape.app"
          python3 - "$APP" "$LOG_DIR" <<'PY_FRAMEWORKS'
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys
          app, log_dir = map(Path, sys.argv[1:])
          candidates = [app/'Mixtape']
          fwdir = app/'Frameworks'
          if fwdir.exists():
              candidates.extend(p for p in fwdir.rglob('*') if p.is_file()
                                and p.parent.suffix == '.framework'
                                and p.name == p.parent.stem)
              candidates.extend(p for p in fwdir.rglob('*.dylib') if p.is_file())
          results = []
          bad = []
          for binary in candidates:
              cmd = subprocess.run(['xcrun', 'vtool', '-show-build', '-arch', 'arm64', str(binary)],
                                   text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if cmd.returncode != 0:
                  # Not every embedded binary will have LC_BUILD_VERSION;
                  # keep the failure visible rather than claiming validation.
                  results.append({'binary': str(binary.relative_to(app)), 'status': 'unverified',
                                  'detail': cmd.stderr.strip()[:300]})
                  continue
              minima = re.findall(r'(?m)^\s*minos\s+(\d+\.\d+(?:\.\d+)?)', cmd.stdout)
              results.append({'binary': str(binary.relative_to(app)), 'minOS': minima})
              if any(tuple(map(int, (v.split('.') + ['0', '0'])[:3])) > (18, 0, 0)
                     for v in minima):
                  bad.append(f'{binary.name}: minimum iOS version {minima}')
          (log_dir/'embedded-minimum-versions.json').write_text(
              json.dumps(results, indent=2), encoding='utf-8')
          if bad:
              raise SystemExit('Frameworks incompatible with iOS 18.0: ' + '; '.join(bad))
          print('No verified arm64 embedded binary requires iOS > 18.0.')
          PY_FRAMEWORKS

      - name: Upload Mixtape for SideStore
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-iOS18-DeepDiagnostics-unsigned-IPA
          path: Mixtape-iOS18-DeepDiagnostics-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save errors and compatibility patches
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          if [ -f "$LOG_DIR/xcodebuild.log" ]; then
            grep -nE 'error:|fatal error:|unavailable in iOS|only available in iOS|requires iOS|BUILD FAILED|No such module|CasePathsMacros|PerceptionMacros|cannot find|undefined symbol|deployment target|linker command failed' "$LOG_DIR/xcodebuild.log" | tail -n 140 > "$LOG_DIR/ios18-errors.txt" || true
          fi
          git diff > "$LOG_DIR/all-port-changes.patch" || true
          if [ -d ios18-reports ]; then cp -R ios18-reports "$LOG_DIR/"; fi
          find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name 'Mixtape.app' -print > "$LOG_DIR/app-paths.txt" 2>/dev/null || true

      - name: Upload compatibility diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-iOS18-DeepDiagnostics-diagnostics
          path: build-ios18-clean/logs/
          if-no-files-found: warn
          retention-days: 14
