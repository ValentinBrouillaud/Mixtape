name: Mixtape - Appetize - Xcode 26.2 (Perception fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      BUILD_ROOT: ${{ github.workspace }}/build-xcode-26-2-clean
      DERIVED_DATA: ${{ github.workspace }}/build-xcode-26-2-clean/DerivedData
      SPM_SOURCES: ${{ github.workspace }}/build-xcode-26-2-clean/SourcePackages
      LOG_DIR: ${{ github.workspace }}/build-xcode-26-2-clean/logs

    steps:
      - name: Checkout Mixtape
        uses: actions/checkout@v4

      - name: Select Xcode 26.2 (mandatory)
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          cat "$RUNNER_TEMP/xcode-version.txt"
          grep -Fxq 'Xcode 26.2' "$RUNNER_TEMP/xcode-version.txt"
          xcrun --find swift
          swift --version

      - name: Create completely fresh build folders
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT"
          mkdir -p "$DERIVED_DATA" "$SPM_SOURCES" "$LOG_DIR"
          xcodebuild -version > "$LOG_DIR/xcode-version.txt"
          xcodebuild -showsdks > "$LOG_DIR/sdks.txt"
          xcodebuild -list -project Mixtape.xcodeproj > "$LOG_DIR/project-schemes.txt" 2>&1

      - name: Set iOS 26.0 for Mixtape only (not Swift packages)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          project = Path("Mixtape.xcodeproj/project.pbxproj")
          content = project.read_text(encoding="utf-8")
          old = "IPHONEOS_DEPLOYMENT_TARGET = 26.1;"
          matches = content.count(old)
          if matches != 2:
              raise SystemExit(f"Expected 2 Mixtape target settings, found {matches}; inspect project.pbxproj")
          project.write_text(
              content.replace(old, "IPHONEOS_DEPLOYMENT_TARGET = 26.0;"),
              encoding="utf-8",
          )
          print("Mixtape target: iOS 26.0 in Debug and Release settings")
          PYCODE
          grep -n 'IPHONEOS_DEPLOYMENT_TARGET' Mixtape.xcodeproj/project.pbxproj

      - name: Install required Carthage frameworks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v carthage >/dev/null 2>&1; then brew install carthage; fi
          carthage version | tee "$LOG_DIR/carthage-version.txt"
          carthage bootstrap --use-xcframeworks --platform iOS 2>&1 | tee "$LOG_DIR/carthage.log"

      - name: Resolve Swift packages in a fresh folder
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            2>&1 | tee "$LOG_DIR/swift-packages.log"

      - name: Build Mixtape for iOS Simulator (Xcode 26.2)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$LOG_DIR/xcodebuild.log"

      - name: Zip Mixtape.app for Appetize
        shell: bash
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Mixtape.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | tee "$LOG_DIR/minimum-ios.txt"
          cd "$(dirname "$APP")"
          ditto -c -k --sequesterRsrc --keepParent Mixtape.app "$GITHUB_WORKSPACE/Mixtape-Appetize.zip"
          ls -lh "$GITHUB_WORKSPACE/Mixtape-Appetize.zip"

      - name: Upload Appetize ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-Appetize-Xcode26-2-PerceptionFix
          path: Mixtape-Appetize.zip
          if-no-files-found: error
          retention-days: 7

      - name: Save diagnostic logs even if build fails
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          if [ -f "$LOG_DIR/xcodebuild.log" ]; then
            grep -nE 'error:|fatal error:|CasePathsMacros|BUILD FAILED|No such module|framework not found|requires iOS|not available in iOS|DYLD_ROOT_PATH' "$LOG_DIR/xcodebuild.log" | tail -n 100 > "$LOG_DIR/error-summary.txt" || true
          fi
          if [ -d "$DERIVED_DATA/Build/Products" ]; then
            find "$DERIVED_DATA/Build/Products" -maxdepth 4 -iname '*CasePaths*' -print > "$LOG_DIR/casepaths-products.txt" || true
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-Xcode26-2-PerceptionFix-diagnostics
          path: build-xcode-26-2-clean/logs/
          if-no-files-found: warn
          retention-days: 7
