name: Mixtape iOS 18 - FoundationModels Availability Pass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      BUILD_ROOT: ${{ github.workspace }}/build-ios18-clean
      DERIVED_DATA: ${{ github.workspace }}/build-ios18-clean/DerivedData
      SPM_SOURCES: ${{ github.workspace }}/build-ios18-clean/SourcePackages
      LOG_DIR: ${{ github.workspace }}/build-ios18-clean/logs

    steps:
      - name: Checkout your Mixtape fork
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          cat "$RUNNER_TEMP/xcode-version.txt"
          grep -Fxq 'Xcode 26.2' "$RUNNER_TEMP/xcode-version.txt"
          test "$(uname -m)" = 'arm64'

      - name: Prepare fresh build directories and macro trust
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT"
          mkdir -p "$DERIVED_DATA" "$SPM_SOURCES" "$LOG_DIR"
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
          xcodebuild -showsdks > "$LOG_DIR/sdks.txt"

      - name: Port visual APIs to iOS 18 and audit the remaining APIs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/port_ios18.py" <<'PYPORT'
          #!/usr/bin/env python3
          """Conservative first-pass iOS 18 compatibility patch for Mixtape.
          
          Run at the root of a checked-out Mixtape repository. All changes are
          restricted to the iOS deployment target and selected SwiftUI visual APIs.
          This is NOT a complete port; the CI build reports outstanding compiler errors.
          """
          from pathlib import Path
          import re
          import sys
          import json
          
          ROOT = Path.cwd()
          project = ROOT / 'Mixtape.xcodeproj/project.pbxproj'
          if not project.is_file() or not (ROOT/'Player').is_dir():
              sys.exit('Run from a Mixtape repository root (Mixtape.xcodeproj and Player required).')
          
          p = project.read_text(encoding='utf-8')
          # Change only app target Debug/Release occurrences; NEVER override all packages via xcodebuild.
          new, count = re.subn(r'(\bIPHONEOS_DEPLOYMENT_TARGET\s*=\s*)26\.1(\s*;)', r'\g<1>18.0\2', p)
          if count not in (0, 2):
              sys.exit(f'Unexpected number of iOS deployment-target occurrences: {count}. No files changed.')
          if count == 0 and len(re.findall(r'\bIPHONEOS_DEPLOYMENT_TARGET\s*=\s*18\.0\s*;', p)) != 2:
              sys.exit('Could not locate exactly two target settings at 26.1 or 18.0; inspect project.pbxproj.')
          project.write_text(new, encoding='utf-8')
          
          # A source-level compatibility shim. No player/download/network services are touched.
          shim = ROOT/'Utilities/MixtapeIOS18Compat.swift'
          if not shim.exists():
              shim.parent.mkdir(parents=True,exist_ok=True)
              shim.write_text('''#if os(iOS)
          import SwiftUI
          
          // Backwards-compatible visual features for iOS 18.
          // All native iOS 26 behavior is preserved on iOS 26+.
          extension View {
              @ViewBuilder
              func mixtapeCompatTabBarMinimizeOnScrollDown() -> some View {
                  if #available(iOS 26.0, *) {
                      self.tabBarMinimizeBehavior(.onScrollDown)
                  } else {
                      self
                  }
              }
          
              @ViewBuilder
              func mixtapeCompatTabViewBottomAccessory<Accessory: View>(
                  @ViewBuilder content: () -> Accessory
              ) -> some View {
                  if #available(iOS 26.0, *) {
                      self.tabViewBottomAccessory(content: content)
                  } else {
                      self.safeAreaInset(edge: .bottom, spacing: 0) {
                          content()
                      }
                  }
              }
          
              @ViewBuilder
              func mixtapeCompatGlassEffect() -> some View {
                  if #available(iOS 26.0, *) {
                      self.glassEffect()
                  } else {
                      self.background(.ultraThinMaterial)
                          .clipShape(RoundedRectangle(cornerRadius: 16, style: .continuous))
                  }
              }
          }
          #endif
          ''',encoding='utf-8')
          
          replacement_stats = {}
          # Only exact, recognizable no-argument/known-argument expressions are changed.
          replacements = (
              ('.tabBarMinimizeBehavior(.onScrollDown)', '.mixtapeCompatTabBarMinimizeOnScrollDown()'),
              ('.tabViewBottomAccessory {', '.mixtapeCompatTabViewBottomAccessory {'),
              ('.glassEffect()', '.mixtapeCompatGlassEffect()'),
              ('.buttonStyle(.glassProminent)', '.buttonStyle(.borderedProminent)'),
              ('.buttonStyle(.glass)', '.buttonStyle(.bordered)'),
          )
          for source in ROOT.rglob('*.swift'):
              if (source.parts[len(ROOT.parts)] not in {'App','Coordinators','Scenes','Views','ViewModels','Utilities'}
                  or source == shim):
                  continue
              current = source.read_text(encoding='utf-8')
              updated = current
              for old,newstr in replacements:
                  # Do not replace inside commented-out lines (basic safe guard).
                  lines=[]
                  for line in updated.splitlines(keepends=True):
                      if line.lstrip().startswith('//'):
                          lines.append(line)
                      else:
                          lines.append(line.replace(old,newstr))
                  updated = ''.join(lines)
              if updated != current:
                  source.write_text(updated,encoding='utf-8')
                  replacement_stats[str(source.relative_to(ROOT))] = sum(current.count(old) for old,_ in replacements)
          
          # Audit: surface unconverted APIs rather than hiding genuine source incompatibilities.
          watch = (
              'tabViewBottomAccessory(', 'tabViewBottomAccessoryPlacement', 'tabBarMinimizeBehavior(',
              'glassEffect(', 'GlassEffectContainer', 'glassEffectID(', '.glassEffectTransition(',
              'backgroundExtensionEffect(', 'scrollEdgeEffectStyle(', 'ToolbarSpacer(',
              'safeAreaBar(', 'tabBarMinimizeBehavior(', 'FoundationModels',
              'LanguageModelSession', 'SystemLanguageModel', 'Tab(role: .search)',
              '.buttonStyle(.glass',
          )
          findings=[]
          for source in ROOT.rglob('*.swift'):
              if 'Carthage' in source.parts or source == shim or '.build' in source.parts: continue
              for n,line in enumerate(source.read_text(encoding='utf-8').splitlines(),start=1):
                  if any(x in line for x in watch):
                      findings.append({'file':str(source.relative_to(ROOT)),'line':n,'source':line.strip()[:220]})
          report_dir= ROOT/'ios18-reports'
          report_dir.mkdir(exist_ok=True)
          (report_dir/'api-audit.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')
          (report_dir/'port-summary.txt').write_text(
              'iOS 18.0 deployment target applied to Mixtape app target only.\n'
              f'Target substitutions: {count}\n'
              f'Swift files modified: {len(replacement_stats)}\n'
              + '\n'.join(f'  {k}: {v} expressions' for k,v in replacement_stats.items())+'\n'
              f'Potential unconverted API references: {len(findings)}\n'
              'Music playback, download and services code intentionally unchanged except exact visual expression replacements.\n',
              encoding='utf-8')
          print((report_dir/'port-summary.txt').read_text(encoding='utf-8'))
          print('iOS 18 API audit saved to',report_dir/'api-audit.json')
          PYPORT
          python3 "$RUNNER_TEMP/port_ios18.py"
          git diff > "$LOG_DIR/ios18-source-changes.patch" || true
          cp -R ios18-reports "$LOG_DIR/"

      - name: Protect iOS 26 Apple Intelligence declarations
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch_foundationmodels_ios18.py" <<'PYAI'
          #!/usr/bin/env python3
          """Mark FoundationModels declarations as iOS 26+ while preserving ordinary music code.

          This is a conservative iOS 18 compiler-compatibility pass. It does not remove
          AI code and does not fix AI callers elsewhere that may need availability guards.
          """
          from pathlib import Path
          import re
          import sys
          import json

          ROOT = Path.cwd()
          REPORT = ROOT / 'ios18-reports' / 'foundationmodels-audit.json'
          CANDIDATE = re.compile(r'^(?P<indent>\s*)(?:(?:(?:public|private|fileprivate|internal|open|final|indirect|nonisolated|static|override|class|mutating|nonmutating)\s+)*)(?P<kind>struct|class|enum|actor|protocol|extension|func|typealias)\s+(?P<name>[^\s:<(\{]+)')


          def scan_depth(lines):
              """Track Swift curly brace depth while ignoring basic comments and strings.

              The scan only determines whether a declaration is likely file-scoped; it
              deliberately aborts for unbalanced text rather than altering risky code.
              """
              depths=[]
              depth=0
              block_comment=False
              triple=False
              for line in lines:
                  depths.append(depth)
                  i=0
                  quote=False
                  escaped=False
                  while i<len(line):
                      if block_comment:
                          if line.startswith('*/',i): block_comment=False; i+=2; continue
                          i+=1; continue
                      if triple:
                          if line.startswith('"""',i): triple=False; i+=3; continue
                          i+=1;continue
                      if quote:
                          if escaped: escaped=False
                          elif line[i]=='\\': escaped=True
                          elif line[i]=='"': quote=False
                          i+=1;continue
                      if line.startswith('//',i): break
                      if line.startswith('/*',i): block_comment=True; i+=2;continue
                      if line.startswith('"""',i): triple=True; i+=3;continue
                      if line[i]=='"': quote=True; i+=1;continue
                      if line[i]=='{': depth+=1
                      if line[i]=='}': depth-=1
                      i+=1
                  if depth<0: raise ValueError('unexpected closing brace')
              # Most Swift files are balanced except for #if conditional branches.
              return depths


          def candidate_sources():
              for path in ROOT.rglob('*.swift'):
                  parts=path.relative_to(ROOT).parts
                  if any(part in {'DerivedData','Carthage','.build','SourcePackages','build-ios18-clean'} for part in parts):
                      continue
                  code=path.read_text(encoding='utf-8')
                  if re.search(r'^\s*import\s+FoundationModels\b',code,re.M):
                      yield path,code


          def patch(path,code):
              lines=code.splitlines(keepends=True)
              depths=scan_depth(lines)
              insertions=[]
              for idx,line in enumerate(lines):
                  if depths[idx]!=0 or line.lstrip().startswith('//'): continue
                  match=CANDIDATE.match(line)
                  if not match: continue
                  # If already marked, do not duplicate. Note attribute may sit several
                  # lines above the declaration, interspersed with @MainActor/@Generable.
                  preceding=[]
                  j=idx-1
                  while j>=0 and (lines[j].strip().startswith('@') or lines[j].strip()=='' or lines[j].strip().startswith('//')):
                      preceding.append(lines[j])
                      j-=1
                  if any('@available(iOS 26' in l for l in preceding): continue
                  indentation=match.group('indent')
                  insertions.append((idx,indentation+'@available(iOS 26.0, *)\n',match.group('kind')+' '+match.group('name')))
              if not insertions:
                  return code, []
              by_index={i:(attribute,which) for i,attribute,which in insertions}
              output=[]
              for idx,line in enumerate(lines):
                  if idx in by_index: output.append(by_index[idx][0])
                  output.append(line)
              return ''.join(output), [d[2] for d in insertions]


          def main():
              if not (ROOT/'Mixtape.xcodeproj').is_dir():
                  raise SystemExit('Launch from the Mixtape repository root.')
              report=[]
              total=0
              for path,code in candidate_sources():
                  updated, symbols=patch(path,code)
                  if updated !=code:
                      path.write_text(updated,encoding='utf-8')
                      total+=len(symbols)
                  report.append({'path':str(path.relative_to(ROOT)),'annotated':symbols,'already_guarded_or_other': not symbols})
              if not report:
                  raise SystemExit('No FoundationModels imports detected: check the checkout and project structure.')
              REPORT.parent.mkdir(exist_ok=True)
              REPORT.write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
              print(f'FoundationModels source files: {len(report)}; declarations annotated: {total}')
              for entry in report:
                  print(entry['path']+': '+(', '.join(entry['annotated']) if entry['annotated'] else '(no new annotation)'))
              print('Note: AI call sites may still need if #available(iOS 26, *) or an iOS 18 fallback.')

          if __name__=='__main__': main()
          PYAI
          python3 "$RUNNER_TEMP/patch_foundationmodels_ios18.py"
          cp ios18-reports/foundationmodels-audit.json "$LOG_DIR/foundationmodels-audit.json"
          git diff > "$LOG_DIR/ios18-source-changes.patch" || true

      - name: Prefer tested CasePaths macros version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Mixtape.xcodeproj/project.pbxproj')
          t=p.read_text()
          a,n=re.subn(r'(repositoryURL = "https://github\.com/pointfreeco/swift-case-paths";\s*requirement = \{\s*kind = upToNextMajorVersion;\s*minimumVersion = )1\.7\.2(;)',r'\g<1>1.10.0\2',t)
          if n not in (0,1): raise SystemExit('Unexpected CasePaths declaration count: '+str(n))
          if n: p.write_text(a)
          PY
          # Re-resolve old lockfile if its pin conflicts with the minimum requirement.

      - name: Install VLCKit XCFrameworks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v carthage >/dev/null 2>&1; then brew install carthage; fi
          carthage bootstrap --use-xcframeworks --platform iOS --cache-builds 2>&1 | tee "$LOG_DIR/carthage.log"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            2>&1 | tee "$LOG_DIR/spm.log"
          RESOLVED='Mixtape.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          if [ -f "$RESOLVED" ]; then cp "$RESOLVED" "$LOG_DIR/Package.resolved"; fi

      - name: Build unsigned iOS 18 iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mixtape.xcodeproj \
            -scheme Mixtape \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SPM_SOURCES" \
            -jobs 2 \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$LOG_DIR/xcodebuild.log"

      - name: Package Mixtape IPA for SideStore
        shell: bash
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug-iphoneos/Mixtape.app"
          test -d "$APP"
          file "$APP/Mixtape"
          lipo "$APP/Mixtape" -verify_arch arm64
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | tee "$LOG_DIR/minimum-ios.txt"
          grep -Fxq '18.0' "$LOG_DIR/minimum-ios.txt"
          mkdir -p "$GITHUB_WORKSPACE/ios18-payload/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/ios18-payload/Payload/Mixtape.app"
          cd "$GITHUB_WORKSPACE/ios18-payload"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Mixtape-iOS18-unsigned.ipa"
          unzip -tq "$GITHUB_WORKSPACE/Mixtape-iOS18-unsigned.ipa"

      - name: Upload Mixtape for SideStore
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-iOS18-FoundationModels-unsigned-IPA
          path: Mixtape-iOS18-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save errors and compatibility patches
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          if [ -f "$LOG_DIR/xcodebuild.log" ]; then
            grep -nE 'error:|fatal error:|unavailable in iOS|only available in iOS|requires iOS|BUILD FAILED|No such module|CasePathsMacros|PerceptionMacros|cannot find' "$LOG_DIR/xcodebuild.log" | tail -n 140 > "$LOG_DIR/ios18-errors.txt" || true
          fi
          git diff > "$LOG_DIR/all-port-changes.patch" || true
          if [ -d ios18-reports ]; then cp -R ios18-reports "$LOG_DIR/"; fi
          find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name 'Mixtape.app' -print > "$LOG_DIR/app-paths.txt" 2>/dev/null || true

      - name: Upload compatibility diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mixtape-iOS18-FoundationModels-diagnostics
          path: build-ios18-clean/logs/
          if-no-files-found: warn
          retention-days: 14
